<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria Zdjęć</title>
    <style>
        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;

        }


        .gallery img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;

        }
    </style>
</head>

<body>

        <img src="R.jpeg" alt="Zdjęcie 1">
        <img src="R3.jpeg" alt="Zdjęcie 2">
        <img src="R 2.jpeg" alt="Zdjęcie 3">
        <img src="R4.jpg" alt="Zdjęcie 4">
        <img src="R5.jpeg" alt="Zdjęcie 5">
        <img src="46.jpeg" alt="Zdjęcie 6">
        <img src="R7.jpg" alt="Zdjęcie 7">
        <img src="R8.jpg" alt="Zdjęcie 8">
        <img src="410.jpeg" alt="Zdjęcie 9">

    </div>

</body>

</html>
